<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <!-- PWA Meta -->
    <title>MODI - MIDI Over BLE</title>
    <meta name="description" content="MODI is a BLE MIDI controller with a real-time piano keyboard, pitch bend, modulation, sustain and multi-touch polyphony." />
    <meta name="theme-color" content="#0088FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MODI" />

    <!-- Force landscape on mobile -->
    <meta name="screen-orientation" content="landscape" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker for PWA install capability -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[MODI] SW registered:', reg.scope))
            .catch(err => console.warn('[MODI] SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
